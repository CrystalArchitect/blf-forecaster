[project]
name = "blf-forecaster"
version = "0.1.0"
description = "Bayesian Linguistic Forecaster (BLF) — a v1 reimplementation of the belief-state agent loop + multi-trial logit aggregation from Murphy (2026), arXiv:2604.18576"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.scripts]
blf = "blf.cli:main"
blf-calibrate = "blf.calibrate_cli:main"
blf-eval = "blf.eval_cli:main"
blf-shrinkage = "blf.shrinkage_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blf"]
